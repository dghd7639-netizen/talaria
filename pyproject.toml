[project]
name = "hermes-mobile-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "websockets",
    "pydantic-settings",
    "sqlalchemy",
    "qrcode[pil]",
    "cryptography",
]

[project.scripts]
hermes-mobile-bridge = "hermes_mobile.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge/hermes_mobile"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
pythonpath = ["bridge"]
